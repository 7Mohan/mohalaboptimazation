plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing: android/key.properties (never committed — see .gitignore)
// holds storeFile, storePassword, keyAlias, keyPassword. Until it exists,
// release builds fall back to the debug key so local builds keep working.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.mohalab.optimization"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.mohalab.optimization"
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // AdMob App ID: Google test ID by default; real ID only in release builds.
        manifestPlaceholders += [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            manifestPlaceholders += [admobAppId: "ca-app-pub-9857418204934084~7368098906"]
            // Enable R8 code shrinking and obfuscation
            minifyEnabled true
            // Enable resource shrinking to remove unused XML, drawables, and strings
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Your upload key when key.properties exists, else the debug key.
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}


dependencies {
    // Shizuku API — privileged Android system operations via binder IPC
    // api: the Java/Kotlin interface to call Shizuku from our app
    // provider: content provider that Shizuku service binds to (REQUIRED in manifest)
    implementation "dev.rikka.shizuku:api:12.2.0"
    implementation "dev.rikka.shizuku:provider:12.2.0"
}
